<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Знак Бородача: связка ключей на карабине -->
  <g fill="#F2B94B">
    <!-- карабин -->
    <circle cx="48" cy="20" r="11" fill="none" stroke="#F2B94B" stroke-width="6"/>
    <path d="M48 9 v-6" stroke="#F2B94B" stroke-width="6" stroke-linecap="round"/>
    <!-- левый ключ -->
    <g transform="translate(37 33) rotate(-28)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#F2B94B" stroke-width="4"/>
      <rect x="-2" y="6" width="4" height="28" rx="2"/>
      <rect x="1.5" y="24" width="7" height="4" rx="1.5"/>
      <rect x="1.5" y="31" width="5" height="4" rx="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#0E1116"/>
    </g>
    <!-- средний ключ -->
    <g transform="translate(48 33)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#F2B94B" stroke-width="4"/>
      <rect x="-2" y="6" width="4" height="30" rx="2"/>
      <rect x="1.5" y="25" width="7" height="4" rx="1.5"/>
      <rect x="1.5" y="32" width="5" height="4" rx="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#0E1116"/>
    </g>
    <!-- правый ключ -->
    <g transform="translate(59 33) rotate(28)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#F2B94B" stroke-width="4"/>
      <rect x="-2" y="6" width="4" height="28" rx="2"/>
      <rect x="1.5" y="24" width="7" height="4" rx="1.5"/>
      <rect x="1.5" y="31" width="5" height="4" rx="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#0E1116"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Бородач-охранник: руки скрещены, доступ закрыт -->
  <g>
    <!-- руки скрещены -->
    <path d="M60 138 C82 158 118 158 142 140" fill="none" stroke="#232A33" stroke-width="14" stroke-linecap="round"/>
    <path d="M140 146 C118 166 82 166 60 148" fill="none" stroke="#232A33" stroke-width="14" stroke-linecap="round"/>
    <circle cx="141" cy="138" r="8" fill="#E0B088"/>
    <circle cx="61" cy="146" r="8" fill="#E0B088"/>
    <!-- куртка -->
    <path d="M55 200 C58 150 66 128 100 124 C134 128 142 150 145 200 Z" fill="#232A33"/>
    <!-- воротник рубашки -->
    <path d="M84 122 L100 142 L116 122 C108 118 92 118 84 122 Z" fill="#2B6CB8"/>
    <!-- связка ключей на поясе -->
    <circle cx="132" cy="170" r="5" fill="none" stroke="#F2B94B" stroke-width="3"/>
    <g transform="translate(132 176) rotate(18)" fill="#F2B94B">
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="#F2B94B" stroke-width="2.5"/>
      <rect x="-1.5" y="3" width="3" height="12" rx="1.5"/>
      <rect x="1" y="10" width="4" height="2.5" rx="1"/>
    </g>
    <!-- голова -->
    <circle cx="100" cy="88" r="30" fill="#E0B088"/>
    <!-- борода -->
    <path d="M70 94 C70 124 84 134 100 134 C116 134 130 124 130 94 C122 106 112 102 100 102 C88 102 78 106 70 94 Z" fill="#C9A06B"/>
    <path d="M86 110 Q100 103 114 110 Q100 118 86 110 Z" fill="#C9A06B"/>
    <path d="M97 96 Q100 102 103 96 Q100 100 97 96 Z" fill="#C9955F"/>
    <!-- строгие глаза -->
    <circle cx="88" cy="92" r="3.2" fill="#0E1116"/>
    <circle cx="112" cy="92" r="3.2" fill="#0E1116"/>
    <path d="M82 82 Q88 84 94 86" fill="none" stroke="#C9A06B" stroke-width="3" stroke-linecap="round"/>
    <path d="M106 86 Q112 84 118 82" fill="none" stroke="#C9A06B" stroke-width="3" stroke-linecap="round"/>
    <!-- ушанка -->
    <path d="M64 80 Q100 40 136 80 Z" fill="#1A1F27"/>
    <rect x="58" y="78" width="84" height="10" rx="5" fill="#1A1F27"/>
    <circle cx="100" cy="62" r="5" fill="#F2B94B"/>

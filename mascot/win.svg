<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Бородач победно поднял ключи -->
  <g>
    <!-- левая рука с ключом вверх -->
    <path d="M60 132 C50 112 46 94 48 78" fill="none" stroke="#232A33" stroke-width="16" stroke-linecap="round"/>
    <circle cx="48" cy="72" r="9" fill="#E0B088"/>
    <g transform="translate(48 66) rotate(-30)" fill="#F2B94B">
      <circle cx="0" cy="0" r="5" fill="none" stroke="#F2B94B" stroke-width="3"/>
      <rect x="-2" y="4" width="4" height="18" rx="2"/>
      <rect x="1.5" y="14" width="5" height="3" rx="1.5"/>
    </g>
    <!-- правая рука с ключом вверх -->
    <path d="M140 132 C150 112 154 94 152 78" fill="none" stroke="#232A33" stroke-width="16" stroke-linecap="round"/>
    <circle cx="152" cy="72" r="9" fill="#E0B088"/>
    <g transform="translate(152 66) rotate(30)" fill="#F2B94B">
      <circle cx="0" cy="0" r="5" fill="none" stroke="#F2B94B" stroke-width="3"/>
      <rect x="-2" y="4" width="4" height="18" rx="2"/>
      <rect x="1.5" y="14" width="5" height="3" rx="1.5"/>
    </g>
    <!-- куртка -->
    <path d="M55 200 C58 150 66 128 100 124 C134 128 142 150 145 200 Z" fill="#232A33"/>
    <!-- воротник рубашки -->
    <path d="M84 122 L100 142 L116 122 C108 118 92 118 84 122 Z" fill="#2B6CB8"/>
    <!-- связка ключей на поясе -->
    <circle cx="132" cy="170" r="5" fill="none" stroke="#F2B94B" stroke-width="3"/>
    <!-- голова -->
    <circle cx="100" cy="88" r="30" fill="#E0B088"/>
    <!-- борода -->
    <path d="M70 94 C70 124 84 134 100 134 C116 134 130 124 130 94 C122 106 112 102 100 102 C88 102 78 106 70 94 Z" fill="#C9A06B"/>
    <path d="M86 110 Q100 103 114 110 Q100 118 86 110 Z" fill="#C9A06B"/>
    <path d="M97 96 Q100 102 103 96 Q100 100 97 96 Z" fill="#C9955F"/>
    <!-- радостные глаза -->
    <path d="M83 92 Q88 87 93 92" fill="none" stroke="#0E1116" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M107 92 Q112 87 117 92" fill="none" stroke="#0E1116" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M82 84 Q88 80 94 83" fill="none" stroke="#C9A06B" stroke-width="3" stroke-linecap="round"/>
    <path d="M106 83 Q112 80 118 84" fill="none" stroke="#C9A06B" stroke-width="3" stroke-linecap="round"/>
    <!-- ушанка -->
    <path d="M64 80 Q100 40 136 80 Z" fill="#1A1F27"/>
    <rect x="58" y="78" width="84" height="10" rx="5" fill="#1A1F27"/>
    <circle cx="100" cy="62" r="5" fill="#F2B94B"/>
  </g>
</svg>

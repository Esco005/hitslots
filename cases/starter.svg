<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Стартовый кейс: синий ящик с тонким контуром -->
  <!-- ручка -->
  <path d="M44 30 Q60 12 76 30" fill="none" stroke="#3D9BFF" stroke-width="4" stroke-linecap="round"/>
  <!-- корпус -->
  <rect x="18" y="30" width="84" height="100" rx="8" fill="#16334F" stroke="#3D9BFF" stroke-width="2"/>
  <!-- блик -->
  <rect x="26" y="40" width="8" height="82" rx="4" fill="#2B6CB8" opacity=".45"/>
  <!-- крышка-полоса -->
  <rect x="14" y="64" width="92" height="16" rx="4" fill="#2B6CB8" stroke="#3D9BFF" stroke-width="2"/>
  <!-- замочная пластина -->
  <rect x="46" y="88" width="28" height="30" rx="6" fill="#0E1116" stroke="#F2B94B" stroke-width="2"/>
  <circle cx="60" cy="99" r="5" fill="#F2B94B"/>
  <rect x="57.5" cy="100" width="5" height="10" rx="2" fill="#F2B94B"/>
  <!-- ножки -->
  <rect x="26" y="130" width="14" height="8" rx="3" fill="#242C36"/>
  <rect x="80" y="130" width="14" height="8" rx="3" fill="#242C36"/>
</svg>

  <path d="M60 26 C74 26 80 38 80 52 C80 70 88 92 88 116 C88 138 76 150 60 150 C44 150 32 138 32 116 C32 92 40 70 40 52 C40 38 46 26 60 26 Z" fill="#B5486F" stroke="#E88BB0" stroke-width="2"/>

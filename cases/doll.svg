  <circle cx="54" cy="56" r="2.5" fill="#0E1116"/>
  <circle cx="66" cy="56" r="2.5" fill="#0E1116"/>
  <circle cx="50" cy="62" r="3" fill="#E88BB0"/>
  <circle cx="70" cy="62" r="3" fill="#E88BB0"/>
  <!-- цветок на фартуке -->
  <g fill="#F2B94B">
    <ellipse cx="60" cy="108" rx="7" ry="9" fill="#E88BB0"/>
    <circle cx="60" cy="108" r="5" fill="#F2B94B"/>
    <ellipse cx="52" cy="102" rx="4" ry="6" fill="#E88BB0" transform="rotate(-30 52 102)"/>
    <ellipse cx="68" cy="102" rx="4" ry="6" fill="#E88BB0" transform="rotate(30 68 102)"/>
